    <style>
      /*
       * The single loading screen. It is pure HTML/CSS and paints with the
       * document, long before the React bundle parses, so there is never a white
       * flash or a second (spinner) screen. Layout: LB monogram -> rotating
       * wireframe octahedron -> progress bar. main.tsx only feeds the bar and
       * removes it.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        transition: opacity 220ms ease-out;
        contain: layout paint style;
      }

      #boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* LB monogram */
      #boot .boot-mark {
        width: 80px;
        height: auto;
        color: #fff;
      }

      /*
       * Decrypting wordmark. Replaces the old wireframe octahedron: a row of
       * fixed-width monospace cells that start as random hex glyphs and
       * progressively lock in to the real letters as the page's critical
       * queries settle. The inline script below drives the scramble; the real
       * progress is fed in from main.tsx through the --p custom property.
       * System monospace is used (zero extra request) so glyph widths stay
       * stable while scrambling and the text never reflows.
       */
      #boot .boot-scramble {
        margin-top: 20px;
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 26px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.16em;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
        white-space: pre;
        user-select: none;
      }

      #boot .boot-scramble span {
        display: inline-block;
        width: 0.62em;
        text-align: center;
        transition: color 0.22s ease, text-shadow 0.22s ease, opacity 0.22s ease;
      }

      #boot .boot-scramble span.is-locked {
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
      }

      #boot .boot-scramble span.is-scrambling {
        color: rgba(255, 255, 255, 0.42);
        text-shadow: none;
      }

      /* Progress bar — compositor-only (transform), no layout thrash. */
      #boot .bar {
        margin-top: 28px;
        width: 200px;
        max-width: 60vw;
        height: 3px;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }

      #boot .bar-fill {
        height: 100%;
        background-color: #fff;
        transform-origin: left center;
      }

      /* Indeterminate shimmer until main.tsx reports real progress. */
      #boot:not([data-progress]) .bar-fill {
        width: 40%;
        animation: boot-bar 1.1s ease-in-out infinite;
      }

      /* Determinate once real progress arrives. */
      #boot[data-progress] .bar-fill {
        width: 100%;
        transform: scaleX(var(--p, 0.15));
        transition: transform 320ms ease-out;
      }

      @keyframes boot-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .boot-scramble span {
          transition: none;
        }
        #boot:not([data-progress]) .bar-fill {
          animation: none;
        }
      }
    </style>

    <script>
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var box = boot.querySelector('.boot-scramble');
        if (!box) return;
        var text = box.getAttribute('data-text') || '';
        var CHARS = '0123456789ABCDEF';
        var cells = [];
        // Build per-character spans so the layout never reflows while scrambling.
        box.textContent = '';
        for (var i = 0; i < text.length; i++) {
          var ch = text.charAt(i);
          var span = document.createElement('span');
          span.setAttribute('data-char', ch);
          span.textContent = ch === ' ' ? '\\u00a0' : ch;
          cells.push(span);
          box.appendChild(span);
        }
        var total = cells.length;
        // Random reveal order so the word decrypts in a scattered pattern.
        var thresholds = cells.map(function () { return Math.random(); });
        var smooth = 0;
        var target = 0;
        var last = performance.now();
        var lastScramble = 0;
        var resolved = false;
        var started = performance.now();
        var MIN_REVEAL_MS = 550;

        // Reduced motion: show the finished word, no scrambling.
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          cells.forEach(function (c) {
            var ch = c.getAttribute('data-char');
            c.textContent = ch === ' ' ? '\\u00a0' : ch;
            c.classList.add('is-locked');
          });
          return;
        }

        function readProgress() {
          var raw = boot.style.getPropertyValue('--p');
          var p = parseFloat(raw);
          return isNaN(p) ? 0 : Math.min(1, Math.max(0, p));
        }

        function tick(now) {
          if (!document.body.contains(boot)) return; // removed -> stop
          var dt = (now - last) / 1000;
          if (dt > 0.1) dt = 0.1;
          last = now;
          target = readProgress();
          smooth += (target - smooth) * Math.min(1, dt * 2.6);

          if (boot.classList.contains('is-hidden')) resolved = true;
          if (resolved || target >= 1) resolved = true;

          var elapsed = now - started;
          var minReveal = MIN_REVEAL_MS;
          for (var i = 0; i < cells.length; i++) {
            var ch = cells[i].getAttribute('data-char');
            if (ch === ' ') { cells[i].textContent = '\\u00a0'; continue; }
            var canLock = elapsed >= thresholds[i] * minReveal;
            var locked = resolved || (smooth >= thresholds[i] && canLock);
            if (locked) {
              cells[i].textContent = ch;
              cells[i].classList.remove('is-scrambling');
              cells[i].classList.add('is-locked');
            } else {
              if (!cells[i].classList.contains('is-scrambling')) {
                cells[i].classList.add('is-scrambling');
              }
              if (now - lastScramble > 72) {
                cells[i].textContent = CHARS.charAt(Math.floor(Math.random() * CHARS.length));
              }
            }
          }
          if (now - lastScramble > 72) lastScramble = now;

          if (!resolved || !boot.classList.contains('is-hidden')) {
            requestAnimationFrame(tick);
          }
        }

        requestAnimationFrame(tick);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
