    <style>
      /*
       * The single loading screen. It is pure HTML/CSS and paints with the
       * document, long before the React bundle parses, so there is never a white
       * flash or a second (spinner) screen. Layout: LB monogram -> rotating
       * dodecahedron -> progress bar. main.tsx only feeds the bar and removes it.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        transition: opacity 220ms ease-out;
        contain: layout paint style;
      }

      #boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* LB monogram */
      #boot .boot-mark {
        width: 80px;
        height: auto;
        color: #fff;
      }

      /*
       * Rotating dodecahedron. Every measurement is expressed in `em` against the
       * container's font-size, so the whole shape resizes by changing one value
       * (font-size). 12 faces are composited on the GPU by a single rotating
       * parent; transform-style keeps them in 3D.
       */
      #boot .poly {
        position: relative;
        width: 1em;
        height: 1em;
        margin-top: 20px;
        font-size: 120px;
        perspective: 8.928571em; /* 500px at the original 56px design */
      }

      #boot .poly-inner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        animation: poly-spin 2.5s linear infinite;
        will-change: transform;
      }

      #boot .poly .face {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0.642857em;
        height: 0.616071em;
        margin-left: -0.321429em;
        margin-top: -0.308929em;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.4);
      }

      #boot .poly .face:nth-child(1) {
        clip-path: polygon(0.053571em 0.248214em, 0.589286em 0.248214em, 0.321429em 0.053571em, 0.155357em 0.5625em, 0.4875em 0.5625em);

      }
      #boot .poly .face:nth-child(2) {

      @keyframes poly-spin {
        to {
          transform: rotate3d(1, 1, 1, 360deg);
        }
      }

      /* Progress bar — compositor-only (transform), no layout thrash. */
      #boot .bar {
        margin-top: 28px;
        width: 200px;
        max-width: 60vw;
        height: 3px;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }

      #boot .bar-fill {
        height: 100%;
        background-color: #fff;
        transform-origin: left center;
      }

      /* Indeterminate shimmer until main.tsx reports real progress. */
      #boot:not([data-progress]) .bar-fill {
        width: 40%;
        animation: boot-bar 1.1s ease-in-out infinite;
      }

      /* Determinate once real progress arrives. */
      #boot[data-progress] .bar-fill {
        width: 100%;
        transform: scaleX(var(--p, 0.15));
        transition: transform 320ms ease-out;
      }

      @keyframes boot-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .poly-inner,
        #boot:not([data-progress]) .bar-fill {
          animation: none;
        }
      }
